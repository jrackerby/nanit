name: validate

# This repository shipped without CI: a change landed and nothing between the
# edit and a running Home Assistant ever validated the manifest. These jobs are
# that missing gate.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # HACS and hassfest both move under us. A repo that only validates on push
    # goes quietly stale between commits, and these repos can sit untouched for
    # months.
    - cron: "0 7 * * 1"
  workflow_dispatch:

env:
  DOMAIN: nanit

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # hassfest, hacs and the shared tests/imports jobs run in
  # jrackerby/gha-workflows validate-integration.yml (workflow_call);
  # master's required contexts are "validate / <job>" (jrackerby/HA#821).
  validate:
    uses: jrackerby/gha-workflows/.github/workflows/validate-integration.yml@master
    with:
      domain: "nanit"
      public: true
      test-command: ""
      run-imports: false

  # The camera client is pip-installed from the wheel manifest.json pins
  # (jrackerby/aionanit), so its 300-test suite runs in THAT repo's CI. What
  # this repo can prove is that the pinned wheel satisfies the code importing
  # it: install exactly what the manifest names, then resolve every symbol
  # the integration imports from aionanit_jr against it. Runs in a venv
  # because the hosted runner's Python is externally managed.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: |
          set -euo pipefail
          uv venv .venv
          python3 -c 'import json;print("\n".join(json.load(open("manifest.json"))["requirements"]))' > requirements.txt
          cat requirements.txt
          uv pip install -p .venv/bin/python -r requirements.txt
          .venv/bin/python .github/scripts/check_requirements.py

      # The unit suite runs in the SAME job rather than a new one, because a
      # new job adds a check NAME, and master's required-context list is a
      # fixed list that a session cannot read (403 on the protection endpoint,
      # jrackerby/whisker-ting#17) let alone edit. Adding a name that is not on
      # that list buys a check that reports and gates nothing.
      #
      # WHAT IS NOT KNOWN HERE: whether this `tests` job is itself on that
      # list. It is not verified -- do not read the placement as proof the
      # suite gates a merge. What IS measured (run 34792366286): the shared
      # workflow's `validate / tests` reports SKIPPED, because `test-command`
      # above is empty, so the context carrying the word "tests" under
      # `validate` certainly gates nothing today. Confirming or fixing that is
      # a branch-protection edit, which is jrackerby/whisker-ting#17 and
      # jrackerby/ha-deebot-discovery#21's subject, not this file's.
      #
      # Installed from tests/requirements.txt, not from a bare `pip install
      # pytest` (LAW.md §15). Runs AFTER the symbol check above so the real
      # aionanit_jr is present: tests/ha_stubs.py stubs only what is missing,
      # so with the wheel installed the suite runs against the real client.
      - name: unit tests
        run: |
          set -euo pipefail
          uv pip install -p .venv/bin/python -r tests/requirements.txt
          .venv/bin/python -m pytest tests/ -q
