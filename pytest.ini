[pytest]
# The suite runs from a STAGED copy holding only aionanit_jr/, tests/ and this
# file -- see validate.yml. Not from the repo root: the root is the integration
# package (hacs.json content_in_root), and its select.py shadows the stdlib
# `select` on any Python that does not build that module in, which the GitHub
# hosted toolcache does not -- pytest then dies importing subprocess. Locally
# it passes on a Debian Python (select is builtin there), so stage anyway.
asyncio_mode = auto
testpaths = tests
