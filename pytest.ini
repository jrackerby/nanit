[pytest]
# The repo root is the integration package itself (hacs.json content_in_root),
# so pytest would otherwise build a Package node for it and import its
# __init__.py, which needs homeassistant. confcutdir stops that walk at tests/;
# pythonpath keeps the top-level aionanit_jr importable from there.
addopts = --confcutdir=tests
pythonpath = .
asyncio_mode = auto
testpaths = tests
